<svg xmlns="http://www.w3.org/2000/svg" width="845" height="295" viewBox="0 0 845 295">
  <!-- Red circle with gradient -->
  <defs>
    <radialGradient id="redGradient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Circle background -->
  <circle cx="147.5" cy="147.5" r="120" fill="url(#redGradient)" filter="url(#glow)" opacity="0.9"/>
  
  <!-- White plus sign -->
  <g transform="translate(147.5, 147.5)">
    <line x1="0" y1="-40" x2="0" y2="40" stroke="white" stroke-width="20" stroke-linecap="round"/>
    <line x1="-40" y1="0" x2="40" y2="0" stroke="white" stroke-width="20" stroke-linecap="round"/>
  </g>
  
  <!-- Text: Margin Notes -->
  <text x="300" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#333333">Margin Notes</text>
</svg>

