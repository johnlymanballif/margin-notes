<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Red circle with gradient -->
  <defs>
    <radialGradient id="redGradientCollapsed" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#ff4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc0000;stop-opacity:1" />
    </radialGradient>
    <filter id="glowCollapsed">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Circle background -->
  <circle cx="250" cy="250" r="200" fill="url(#redGradientCollapsed)" filter="url(#glowCollapsed)" opacity="0.9"/>
  
  <!-- White plus sign -->
  <g transform="translate(250, 250)">
    <line x1="0" y1="-70" x2="0" y2="70" stroke="white" stroke-width="35" stroke-linecap="round"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="white" stroke-width="35" stroke-linecap="round"/>
  </g>
</svg>

